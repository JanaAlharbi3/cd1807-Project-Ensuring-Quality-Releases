trigger:
  - main

# Self-hosted agent on your VM
pool:
  name: Default

variables:
  RESOURCE_GROUP: "eqr-rg-ci"
  APP_NAME_PREFIX: "jana-eqr-ci-"
  APP_ZIP: "build/app.zip"

stages:
  # ================= CI =================
  - stage: BuildAndTest
    displayName: "Build & Test"
    jobs:
      - job: ci
        displayName: "Lint & unit tests"
        variables:
          - group: eqr-secrets
        steps:
          - checkout: self

          - bash: |
              set -euxo pipefail
              export DEBIAN_FRONTEND=noninteractive

              # base tooling
              sudo apt-get update
              sudo apt-get install -y \
                ca-certificates curl zip unzip \
                python3 python3-venv python3-distutils

              # make sure pip works on py3.6
              python3 -m ensurepip || true
              python3 -m pip install --user 'pip<22.0' 'setuptools<60' wheel

              # venv
              python3 -m venv .venv
              . .venv/bin/activate
              python -V
              python -m pip --version

              # deps/tools
              pip install 'flake8<6' 'pytest<8'

              # lint (ignore venv/build/.git); allow 120-char lines
              flake8 . --exclude .venv,build,.git --max-line-length 120

              # tests — treat exit 5 (“no tests collected”) as success
              set +e
              pytest -q
              s=$?
              set -e
              if [ "$s" -eq 5 ]; then
                echo "Pytest: no tests collected, continuing."
              elif [ "$s" -ne 0 ]; then
                echo "Pytest failed with exit $s"; exit "$s"
              fi
            displayName: "Ensure Python + venv + lint & tests (py36-safe)"

          - bash: |
              set -euxo pipefail
              mkdir -p build
              zip -r "$(APP_ZIP)" . \
                -x ".git/*" ".venv/*" "build/*" "__pycache__/*" "*.pyc"
              ls -lh "$(APP_ZIP)"
            displayName: "Package app (zip)"

          - publish: $(APP_ZIP)
            artifact: appzip
            displayName: "Publish artifact"

  # ================= CD =================
  - stage: Deploy
    displayName: "Deploy to App Service"
    dependsOn: BuildAndTest
    jobs:
      - deployment: deploy
        displayName: "Zip deploy"
        environment: "dev"
        variables:
          - group: eqr-secrets # CLIENT_ID, CLIENT_SECRET, TENANT_ID, SUBSCRIPTION_ID
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: appzip

                - bash: |
                    set -euxo pipefail

                    # Install Azure CLI if missing
                    if ! command -v az >/dev/null 2>&1; then
                      curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
                    fi

                    # Login with SP and set subscription
                    az login --service-principal \
                      -u "$CLIENT_ID" -p "$CLIENT_SECRET" --tenant "$TENANT_ID" >/dev/null
                    az account set --subscription "$SUBSCRIPTION_ID"

                    # Find latest web app created by CI
                    APP_NAME="$(az webapp list -g "$(RESOURCE_GROUP)" \
                      --query "reverse(sort_by([?starts_with(name, '$(APP_NAME_PREFIX)')], &name))[:1].name" -o tsv)"
                    if [ -z "$APP_NAME" ]; then
                      echo "No webapp matching '$(APP_NAME_PREFIX)' in RG '$(RESOURCE_GROUP)'." >&2
                      exit 1
                    fi
                    echo "Deploying to: ${APP_NAME}"

                    az webapp deployment source config-zip \
                      -g "$(RESOURCE_GROUP)" -n "${APP_NAME}" \
                      --src "$(Pipeline.Workspace)/appzip/app.zip"

                    HOST="$(az webapp show -g "$(RESOURCE_GROUP)" -n "${APP_NAME}" --query "defaultHostName" -o tsv)"
                    echo "Smoke check https://${HOST}/"
                    curl -sS --head --max-time 20 "https://$HOST/" || true
                  displayName: "Login + Deploy (zip) + smoke check"
                  env:
                    CLIENT_ID: $(CLIENT_ID)
                    CLIENT_SECRET: $(CLIENT_SECRET)
                    TENANT_ID: $(TENANT_ID)
                    SUBSCRIPTION_ID: $(SUBSCRIPTION_ID)

  # -------------------- TEST STAGE --------------------
  - stage: TestSuites
    displayName: "Run Postman, Selenium, JMeter"
    dependsOn: Deploy
    variables:
      APP_BASE_URL: "https://jana-eqr-ci-61.azurewebsites.net" # <-- change if your latest app name changes
      JMETER_VER: "5.5"
    jobs:
      # ---------- Postman ----------
      - job: postman
        displayName: "Postman collection → HTML + JUnit"
        pool: { name: Default }
        steps:
          - checkout: self
          - bash: |
              set -euxo pipefail
              if ! command -v node >/dev/null 2>&1; then
                curl -fsSL https://deb.nodesource.com/setup_16.x | sudo -E bash -
                sudo apt-get install -y nodejs
              fi
              sudo npm i -g newman newman-reporter-htmlextra

              mkdir -p reports/postman
              echo "Collections present:"
              ls -la "$(Build.SourcesDirectory)/automatedtesting/postman"

              # run your repo's collection
              set +e
              newman run "$(Build.SourcesDirectory)/automatedtesting/postman/StarterAPIs.json" \
                --env-var baseUrl=$(APP_BASE_URL) \
                -r cli,htmlextra,junit \
                --reporter-htmlextra-export reports/postman/postman-report.html \
                --reporter-junit-export   reports/postman/postman-junit.xml
              NEWMAN_RC=$?
              set -e
              # keep going even if assertions fail so artifacts publish
              exit 0
            displayName: "Run Newman (StarterAPIs.json)"

          - task: PublishTestResults@2
            displayName: "Publish Postman JUnit to Tests tab"
            inputs:
              testResultsFormat: "JUnit"
              testResultsFiles: "reports/postman/postman-junit.xml"
              failTaskOnFailedTests: false

          - publish: reports/postman
            artifact: postman-report
            displayName: "Publish: Postman HTML report"

      # ---------- Selenium (with Log Analytics push) ----------
      - job: selenium
        displayName: "Selenium → pipeline log + push to Log Analytics"
        pool: { name: Default }
        variables:
          - group: eqr-secrets # must contain LOGW_ID, LOGW_KEY (workspace id & primary key)
        steps:
          - checkout: self
          - bash: |
              set -euxo pipefail
              export DEBIAN_FRONTEND=noninteractive

              sudo apt-get update
              sudo apt-get install -y python3 python3-pip python3-venv unzip curl jq xvfb \
                                      chromium-browser chromium-chromedriver

              python3 -m venv .venv
              . .venv/bin/activate
              pip install -U pip 'selenium<4' 'pytest<8'  # selenium 3.x to match old chromedriver on bionic

              export CHROME_BIN=/usr/bin/chromium-browser
              export CHROMEDRIVER_PATH=/usr/lib/chromium-browser/chromedriver
              export BASE_URL="$(APP_BASE_URL)"

              mkdir -p reports/selenium
              set +e
              xvfb-run -a python automatedtesting/selenium/login.py | tee reports/selenium/selenium.log
              SEL_RC=${PIPESTATUS[0]}
              set -e

              # ---- Build one JSON record for Log Analytics custom table: Selenium_CL ----
              now_utc="$(date -u +%FT%TZ)"
              status_txt=$([ "$SEL_RC" -eq 0 ] && echo PASSED || echo FAILED)
              msg_tail="$(tail -n 5 reports/selenium/selenium.log | tr -d '\r')"

              body=$(jq -Rn --arg t "$now_utc" \
                             --arg s "$status_txt" \
                             --arg n "SeleniumSuite" \
                             --arg m "$msg_tail" \
                             '{TimestampUtc:$t, Status:$s, TestName:$n, Message:$m}')

              # ---- Robust signing for the Data Collector API ----
              rfc_date="$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S GMT')"
              content_len="$(printf '%s' "$body" | wc -c | tr -d ' ')"
              stringToSign="POST\n${content_len}\napplication/json\nx-ms-date:${rfc_date}\n/api/logs"

              decoded_key="$(printf '%s' "$LOGW_KEY" | base64 -d 2>/dev/null)"
              signature="$(printf '%s' "$stringToSign" \
                | openssl dgst -binary -sha256 -mac HMAC -macopt "key:$decoded_key" \
                | base64)"

              LA_URL="https://${LOGW_ID}.ods.opinsights.azure.com/api/logs?api-version=2016-04-01"

              HTTP_CODE=$(
                curl -sS -o /tmp/la.out -w '%{http_code}' \
                  "$LA_URL" \
                  -H "Content-Type: application/json" \
                  -H "Log-Type: Selenium" \
                  -H "time-generated-field: TimestampUtc" \
                  -H "x-ms-date: $rfc_date" \
                  -H "Authorization: SharedKey ${LOGW_ID}:${signature}" \
                  --data-binary "$body"
              )

              echo "Log Analytics HTTP_CODE: $HTTP_CODE"
              echo "StringToSign: [$stringToSign]"
              echo "Payload bytes: $content_len"
              echo "Response tail:"; tail -c 300 /tmp/la.out || true

              # Exit with Selenium result so the job reflects pass/fail
              exit "$SEL_RC"
            displayName: "Run Selenium & push logs"
            env:
              LOGW_ID: $(LOGW_ID)
              LOGW_KEY: $(LOGW_KEY)

          - publish: reports/selenium
            artifact: selenium-logs
            displayName: "Publish: Selenium logs"

      # ---------- JMeter ----------
      - job: jmeter
        displayName: "JMeter → .jtl + HTML report"
        pool: { name: Default }
        steps:
          - checkout: self
          - bash: |
              set -euxo pipefail
              export DEBIAN_FRONTEND=noninteractive
              sudo apt-get update
              sudo apt-get install -y openjdk-11-jre-headless wget unzip

              JM="apache-jmeter-$(JMETER_VER)"
              wget -q https://downloads.apache.org/jmeter/binaries/${JM}.zip || \
              wget -q https://archive.apache.org/dist/jmeter/binaries/${JM}.zip
              unzip -q ${JM}.zip
              export PATH="$PWD/${JM}/bin:$PATH"

              mkdir -p reports/jmeter
              jmeter -n -t automatedtesting/jmeter/Starter.jmx \
                     -JtargetHost="$(APP_BASE_URL)" \
                     -l reports/jmeter/results.jtl \
                     -e -o reports/jmeter/html
            displayName: "Run JMeter headless"

          - publish: reports/jmeter
            artifact: jmeter-report
            displayName: "Publish: JMeter HTML report"
