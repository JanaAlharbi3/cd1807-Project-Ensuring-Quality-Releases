trigger:
  - main

# Self-hosted agent on your VM
pool:
  name: Default

variables:
  RESOURCE_GROUP: "eqr-rg-ci"
  APP_NAME_PREFIX: "jana-eqr-ci-"
  APP_ZIP: "build/app.zip"

stages:
  # ================= CI =================
  - stage: BuildAndTest
    displayName: "Build & Test"
    jobs:
      - job: ci
        displayName: "Lint & unit tests"
        variables:
          - group: eqr-secrets # must contain CLIENT_ID, CLIENT_SECRET, TENANT_ID, SUBSCRIPTION_ID
        steps:
          - checkout: self

          - bash: |
              set -euxo pipefail
              export DEBIAN_FRONTEND=noninteractive

              # Base tooling (zip included)
               sudo apt-get update
               sudo apt-get install -y \
                ca-certificates curl zip unzip \
                python3 python3-venv python3-distutils

              # --- Python 3.6: bootstrap pip that still supports 3.6 ---
              curl -sS https://bootstrap.pypa.io/pip/3.6/get-pip.py -o get-pip.py
              sudo -H python3 get-pip.py
              python3 -m pip install --upgrade "pip<22.0" "setuptools<60" "wheel<0.38"

              # Create venv (fallback to virtualenv if venv is cranky)
              if ! python3 -m venv .venv >/dev/null 2>&1; then
                python3 -m pip install "virtualenv==20.24.5"
                python3 -m virtualenv -p python3 .venv
              fi

              . .venv/bin/activate
              python -V
              pip --version

              # Tools that still work on 3.6
              pip install "flake8<6" "pytest<8"

              # Lint (ignore venv/build/.git); allow 120-char lines
              flake8 . --exclude .venv,build,.git --max-line-length 120

              # Tests: treat “no tests collected” (exit 5) as success
              set +e
              pytest -q
              rc=$?
              set -e
              if [ "$rc" -eq 5 ]; then
                echo "Pytest: no tests collected, continuing."
              elif [ "$rc" -ne 0 ]; then
                echo "Pytest failed with exit $rc"; exit "$rc"
              fi
            displayName: "Ensure Python + venv + lint & tests (py36-safe)"

          - bash: |
              set -euxo pipefail
              mkdir -p build
              zip -r "$(APP_ZIP)" . \
                -x ".git/*" ".venv/*" "build/*" "__pycache__/*" "*.pyc"
              ls -lh "$(APP_ZIP)"
            displayName: "Package app (zip)"

          - publish: $(APP_ZIP)
            artifact: appzip
            displayName: "Publish artifact"

  # ================= CD =================
  - stage: Deploy
    displayName: "Deploy to App Service"
    dependsOn: BuildAndTest
    jobs:
      - deployment: deploy
        displayName: "Zip deploy"
        environment: "dev"
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: appzip

                - bash: |
                    set -euxo pipefail

                    # Azure CLI (install if missing)
                    if ! command -v az >/dev/null 2>&1; then
                      curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
                    fi

                    # --- LOGIN WITH SERVICE PRINCIPAL ---
                    az login --service-principal \
                      -u "$CLIENT_ID" -p "$CLIENT_SECRET" --tenant "$TENANT_ID" >/dev/null

                    az account set --subscription "$SUBSCRIPTION_ID"

                    # Find the newest webapp in the RG that matches the prefix
                    APP_NAME="$(az webapp list -g "$(RESOURCE_GROUP)" \
                      --query "reverse(sort_by([?starts_with(name, '$(APP_NAME_PREFIX)')], &name))[:1].name" -o tsv)"

                    if [ -z "$APP_NAME" ]; then
                      echo "No webapp matching '$(APP_NAME_PREFIX)' in RG '$(RESOURCE_GROUP)'." >&2
                      exit 1
                    fi
                    echo "Deploying to: ${APP_NAME}"

                    az webapp deployment source config-zip \
                      -g "$(RESOURCE_GROUP)" -n "${APP_NAME}" \
                      --src "$(Pipeline.Workspace)/appzip/app.zip"

                    HOST="$(az webapp show -g "$(RESOURCE_GROUP)" -n "${APP_NAME}" --query "defaultHostName" -o tsv)"
                    echo "Smoke check https://${HOST}/"
                    curl -I --max-time 20 "https://${HOST}/" || true
                  displayName: "Login + Deploy (zip) + smoke check"
                  env:
                    CLIENT_ID: $(CLIENT_ID)
                    CLIENT_SECRET: $(CLIENT_SECRET)
                    TENANT_ID: $(TENANT_ID)
                    SUBSCRIPTION_ID: $(SUBSCRIPTION_ID)
